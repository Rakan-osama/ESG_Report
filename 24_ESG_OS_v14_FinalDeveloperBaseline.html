<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESG OS v14 — Final Developer Target-State Baseline (EnergyUp)</title>
  <link rel="stylesheet" href="assets/app.css">
</head>

<body>
  <div id="app">
    <div id="topbar">
      <div class="searchBox">🔍 <input placeholder="Search" onfocus="toast('Global search (prototype)')"><span
          class="kbd">⌘K</span></div>
      <span class="sep"></span>
      <span class="demoTag" data-i="demoTag">DEMO DATA</span>
      <span class="cyclePill" id="cyclePill"></span>
      <select id="roleSel"
        title="Demo role switcher (demo control only — changes navigation, never permissions)"></select>
      <select id="langSel">
        <option value="en">🌐 English</option>
        <option value="ar">🌐 العربية</option>
      </select>
      <button class="iconBtn" onclick="toast('Notifications')">🔔</button>
      <div class="avatar">
        <div class="av" id="avIni">LA<i></i></div>
        <div>
          <div class="nm" id="userTag"></div>
          <div class="em" id="userMail">user@energyup.example</div>
        </div>
      </div>
      <button class="iconBtn" title="Sign out" onclick="location.hash='#/login';render()">⎋ sign out</button>
    </div>
    <nav id="sidebar"></nav>
    <main id="main"></main>
  </div>
  <div id="ovl" onclick="closeDrawer()"></div>
  <div id="drawer"></div>
  <div id="toast"></div>

  <!-- data: KPI master (generated from assets/data/kpi-master.json) -->
  <script src="assets/data/kpi-master.js"></script>

  <!-- application, in the original execution order -->
  <script src="assets/js/01-config.js"></script>
  <script src="assets/js/02-i18n.js"></script>
  <script src="assets/js/03-roles.js"></script>
  <script src="assets/js/04-data.js"></script>
  <script src="assets/js/05-framework.js"></script>
  <script src="assets/js/06-navigation.js"></script>
  <script src="assets/js/07-views.js"></script>
  <script src="assets/js/08-engine.js"></script>
  <script src="assets/js/09-workspace-shell.js"></script>
  <script src="assets/js/10-report-renderer.js"></script>
  <script src="assets/js/11-dashboard.js"></script>
  <script src="assets/js/12-data-catalog.js"></script>
  <script src="assets/js/13-data-model.js"></script>
  <script src="assets/js/14-boot.js"></script>
</body>

</html>
